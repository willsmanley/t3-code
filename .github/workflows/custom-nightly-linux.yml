name: Custom nightly Linux desktop

on:
  schedule:
    # Run after upstream's working day so the fork incorporates the latest
    # default-branch changes before producing the next desktop build.
    - cron: "23 03 * * *"
  workflow_dispatch:

concurrency:
  group: custom-nightly-linux
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPDATE_REPOSITORY: willsmanley/t3-code
  # These are the public production client identifiers used by the upstream
  # release. They contain no server-side credentials.
  T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
  T3CODE_CLERK_JWT_TEMPLATE: t3-relay
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
  T3CODE_RELAY_URL: https://relay.t3.codes

jobs:
  sync:
    name: Sync upstream main
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      upstream: ${{ steps.ref.outputs.upstream }}
      date: ${{ steps.ref.outputs.date }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export synced commit
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The desktop and Android builds merge this one upstream commit so both
          # apps in a release ship the same code.
          upstream="$(git ls-remote https://github.com/pingdotgg/t3code.git refs/heads/main | cut -f1)"
          test -n "$upstream"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish Linux nightly
    needs: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.nightly.outputs.tag }}
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: willsmanley/t3-code
      T3CODE_RELEASE_BASE_URL: https://github.com/willsmanley/t3-code/releases/download
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout synced commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.ref }}
          fetch-depth: 0

      - name: Merge upstream for this build
        shell: bash
        env:
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream }}
        run: |
          set -euo pipefail
          git config user.name "t3code-nightly[bot]"
          git config user.email "t3code-nightly[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream "$UPSTREAM_SHA"
          # Keep the fork's intentional sidebar surface when upstream changes
          # the same files so a conflict cannot skip the nightly runtime.
          git merge -X ours --no-edit FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential imagemagick libsecret-1-dev pkg-config

      - name: Resolve nightly version
        id: nightly
        shell: bash
        env:
          NIGHTLY_DATE: ${{ needs.sync.outputs.date }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          nightly_sha="$(git rev-parse HEAD)"
          node scripts/resolve-nightly-release.ts \
            --date "$NIGHTLY_DATE" \
            --run-number "$NIGHTLY_RUN_NUMBER" \
            --sha "$nightly_sha" \
            --github-output
          nightly_version="$(sed -n 's/^version=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          test -n "$nightly_version"
          node scripts/update-release-package-versions.ts "$nightly_version"

      - name: Build JavaScript bundle
        env:
          T3CODE_AUTO_UPDATE: "true"
        run: vp run build:desktop

      # SSH environments install the desktop's exact version. Publish its
      # runtime in the same release so upgrading cannot strand remote hosts.
      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build resource monitor for the CLI archive
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"

      - name: Build and smoke-test matching SSH runtime
        env:
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/build-cli-archive.ts \
            --platform linux --arch x64 --version "$NIGHTLY_VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-assets
          node scripts/smoke-cli-archive.ts \
            --archive "release-assets/t3-$NIGHTLY_VERSION-linux-x64.tar.gz" \
            --expect-version "$NIGHTLY_VERSION"

      - name: Package Linux desktop
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          T3CODE_DESKTOP_VERSION: ${{ steps.nightly.outputs.version }}
          T3CODE_DESKTOP_PLATFORM: linux
          T3CODE_DESKTOP_TARGET: AppImage
          T3CODE_DESKTOP_ARCH: x64
          T3CODE_DESKTOP_OUTPUT_DIR: release-assets
          T3CODE_DESKTOP_SKIP_BUILD: "true"
          T3CODE_DESKTOP_SIGNED: "false"
        run: |
          mkdir -p release-assets
          node scripts/build-desktop-artifact.ts \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "${T3CODE_DESKTOP_VERSION}" \
            --skip-build \
            --output-dir release-assets

      - name: Write checksums
        env:
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -- *.AppImage *.deb "t3-$NIGHTLY_VERSION-linux-x64.tar.gz" > SHA256SUMS

      # Branch runs are test builds; only main publishes.
      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.nightly.outputs.tag }}
          RELEASE_NAME: ${{ steps.nightly.outputs.name }}
          RELEASE_REF: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_REF" \
              --title "$RELEASE_NAME" \
              --prerelease \
              --latest=false \
              --generate-notes
          fi

  android:
    name: Build Android nightly
    needs: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The preview variant carries the nightly icon and label. The fork build
      # installs beside the store app under its own package and signing key.
      APP_VARIANT: preview
      T3CODE_MOBILE_APP_NAME: T3 Code Fork
      T3CODE_ANDROID_PACKAGE: com.willsmanley.t3code
      T3CODE_ANDROID_VERSION_CODE: ${{ github.run_number }}
      # Each nightly APK carries its own JavaScript; T3's over-the-air updates
      # target the store builds.
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      EXPO_NO_GIT_STATUS: "1"
      # Public certificate fingerprint of the fork's signing key. The private key
      # lives in the repository secrets and in Bitwarden.
      ANDROID_SIGNING_CERT_SHA256: 6DEBB2EA31768F3634B1FF7B81E234D7D8D8E234EC34615C8D60B5CDC6691D83
    steps:
      - name: Checkout synced commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.ref }}
          fetch-depth: 0

      - name: Merge upstream for this build
        shell: bash
        env:
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream }}
        run: |
          set -euo pipefail
          git config user.name "t3code-nightly[bot]"
          git config user.email "t3code-nightly[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream "$UPSTREAM_SHA"
          # Keep the fork's intentional sidebar surface when upstream changes
          # the same files so a conflict cannot skip the nightly runtime.
          git merge -X ours --no-edit FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Resolve nightly version
        id: nightly
        shell: bash
        env:
          NIGHTLY_DATE: ${{ needs.sync.outputs.date }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          node scripts/resolve-nightly-release.ts \
            --date "$NIGHTLY_DATE" \
            --run-number "$NIGHTLY_RUN_NUMBER" \
            --sha "$(git rev-parse HEAD)" \
            --github-output

      - name: Build signed APK
        shell: bash
        env:
          T3CODE_MOBILE_VERSION: ${{ steps.nightly.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          cd apps/mobile
          pnpm exec expo prebuild --clean --platform android --no-install
          # Android Gradle Plugin signs every variant with an injected config.
          {
            echo "android.injected.signing.store.file=$keystore"
            echo "android.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
            echo "android.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
            echo "android.injected.signing.key.password=$ANDROID_KEYSTORE_PASSWORD"
          } >> android/gradle.properties
          (cd android && ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a)
          mkdir -p "$GITHUB_WORKSPACE/android-assets"
          cp android/app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/android-assets/T3-Code-Fork-$T3CODE_MOBILE_VERSION-arm64.apk"

      - name: Check APK signature and identity
        shell: bash
        run: |
          set -euo pipefail
          apk="$(ls android-assets/*.apk)"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          digest="$("$build_tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          expected="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr 'A-F' 'a-f')"
          if [ "$digest" != "$expected" ]; then
            echo "APK is signed with $digest, expected $expected" >&2
            exit 1
          fi
          "$build_tools/aapt2" dump badging "$apk" | head -n 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-assets/*.apk
          if-no-files-found: error
          retention-days: 7

  publish-android:
    name: Add Android to the nightly release
    needs: [build, android]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-assets

      - name: Upload APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd android-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          sha256sum -- *.apk >> SHA256SUMS
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *.apk SHA256SUMS
